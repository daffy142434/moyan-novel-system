appId: com.local-ai-app.app
productName: Local AI App
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - nsis
  icon: public/vite.svg
mac:
  target:
    - dmg
  icon: public/vite.svg
linux:
  target:
    - AppImage
  icon: public/vite.svg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
